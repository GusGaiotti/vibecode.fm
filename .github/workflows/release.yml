name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: vibecode-fm-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: vibecode-fm-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: vibecode-fm-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: vibecode-fm-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/vibecode-fm
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
