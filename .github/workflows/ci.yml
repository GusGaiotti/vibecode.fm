name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh examples/*.sh tests/run-tests.sh tests/mocks/*
      - name: tests
        run: bash tests/run-tests.sh
